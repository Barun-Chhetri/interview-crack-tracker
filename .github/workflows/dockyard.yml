# Added by `dockyard deploy`. Builds the image, pushes it to ghcr.io and tells Dockyard to deploy it.
name: Deploy to Dockyard

on:
  push:
    branches: [main]
  delete:
  workflow_dispatch:

jobs:
  # A deleted branch tells Dockyard to remove that branch's preview deployment.
  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Tell Dockyard the branch is gone
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          HOOK_URL: ${{ secrets.DOCKYARD_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.DOCKYARD_HOOK_SECRET }}
          BRANCH: ${{ github.event.ref }}
        run: |
          BODY=$(jq -nc --arg image "${IMAGE,,}" --arg branch "$BRANCH" '{image: $image, branch: $branch, event: "branch-deleted"}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | sed 's/^.* //')
          curl -fsS -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Dockyard-Timestamp: $TS" \
            -H "X-Dockyard-Signature: sha256=$SIG" \
            -d "$BODY"

  deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on ghcr.io must be lowercase. Only the deploy branch moves the "latest" tag.
      - id: image
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$NAME:$GITHUB_SHA"
          [ "$GITHUB_REF_NAME" = "main" ] && TAGS="$TAGS,$NAME:latest"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.image.outputs.tags }}

      - name: Tell Dockyard to deploy
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          HOOK_URL: ${{ secrets.DOCKYARD_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.DOCKYARD_HOOK_SECRET }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
        run: |
          BODY=$(jq -nc --arg image "$IMAGE" --arg digest "$DIGEST" --arg commit "$GITHUB_SHA" --arg message "$MESSAGE" --arg branch "$BRANCH" \
            '{image: $image, digest: $digest, commit: $commit, message: $message, branch: $branch}')
          TS=$(date +%s)
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | sed 's/^.* //')
          curl -fsS -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Dockyard-Timestamp: $TS" \
            -H "X-Dockyard-Signature: sha256=$SIG" \
            -d "$BODY"
